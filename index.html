  <style>
    body { background: #F5F7FA; font-family: Arial, sans-serif; }

    /* ── HEADER ── */
    .sae-header {

      padding: 22px 28px 18px;
      color: white;
    }
    .sae-header .brand { font-size: 24px; font-weight: 900; letter-spacing: 1px; }
    .sae-header .subtitle { font-size: 16px; font-weight: 700; opacity: .9; }
    .sae-header .hint { font-size: 13px; opacity: .7; }
    .badge-tag {
      background: rgba(255,255,255,.15);
      border-radius: 20px;
      padding: 3px 12px;
      font-size: 12px;
      display: inline-block;
      margin: 2px;
    }

    /* ── PASANTE CARD ── */
    .pasante-card {
      background: white;
      border-radius: 14px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      border: 3px solid transparent;
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }
    .pasante-card.active { transform: scale(1.02); }
    .pasante-card .card-header-custom {
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .pasante-card .avatar { font-size: 32px; }
    .pasante-card .p-name { color: white; font-weight: 800; font-size: 16px; }
    .pasante-card .p-area { color: rgba(255,255,255,.8); font-size: 12px; margin-top: 2px; }
    .pasante-card .card-body-custom { padding: 14px 18px; }
    .tag-pill {
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      display: inline-block;
      margin: 2px;
    }
    .ver-btn {
      border-radius: 8px;
      padding: 6px 20px;
      font-size: 12px;
      font-weight: 800;
      display: inline-block;
      cursor: pointer;
      border: none;
      transition: all .2s;
    }

    /* ── PLAN DETAIL ── */
    .plan-detail-header {
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .plan-detail-header .avatar-lg { font-size: 36px; }

    /* ── TABS ── */
    .tab-btn {
      background: white;
      color: #555;
      border: 2px solid #DDD;
      border-radius: 8px;
      padding: 7px 16px;
      cursor: pointer;
      font-family: Arial;
      font-size: 13px;
      font-weight: 700;
      transition: all .2s;
    }
    .tab-btn.active { background: #1A3F6F; color: white; border-color: #1A3F6F; }

    /* ── DARIEL SEMANAS ── */
    .dariel-sem-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 8px rgba(0,0,0,.07);
      border: 1px solid #EEE;
      overflow: hidden;
      display: flex;
      margin-bottom: 10px;
    }
    .dariel-sem-label {
      background: #1A3F6F;
      color: white;
      padding: 14px 16px;
      min-width: 120px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }
    .act-chip {
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
      margin: 3px;
    }

    /* ── PARALLEL TABLE ── */
    .parallel-header {
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    .parallel-col-compras { background: #FFF3E0; padding: 10px 16px; text-align: center; border-right: 1px solid #EEE; }
    .parallel-col-accesos { background: #E8F5E9; padding: 10px 16px; text-align: center; }

    /* ── MKT PHASE BUTTONS ── */
    .phase-btn {
      border-radius: 8px;
      padding: 6px 12px;
      cursor: pointer;
      font-family: Arial;
      font-size: 12px;
      font-weight: 700;
      border: 2px solid #DDD;
      background: white;
      color: #444;
      transition: all .2s;
      margin: 3px;
    }
    .phase-btn .phase-id { font-size: 10px; opacity: .8; display: block; }

    /* ── WEEK ROW ── */
    .week-row { padding: 14px 18px; border-bottom: 1px solid #F0F0F0; }
    .week-row:last-child { border-bottom: none; }
    .week-row:nth-child(odd) { background: white; }
    .week-row:nth-child(even) { background: #FAFAFA; }
    .sem-badge {
      border-radius: 8px;
      padding: 4px 12px;
      font-weight: 800;
      font-size: 12px;
      white-space: nowrap;
      display: inline-block;
    }
    .hrs-badge {
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      display: inline-block;
    }
    .day-label {
      border-radius: 6px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 700;
      margin-right: 6px;
      white-space: nowrap;
      color: white;
      display: inline;
    }
    .ent-pill {
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 1px 8px rgba(0,0,0,.07);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .stat-icon { font-size: 28px; }
    .stat-value { font-size: 22px; font-weight: 900; }
    .stat-label { font-size: 12px; color: #777; }

    .context-banner {
      background: #FFF8E1;
      border: 1px solid #FFD54F;
      border-radius: 10px;
      padding: 10px 16px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    /* ── LEGEND ── */
    .legend-box {
      background: white;
      border-radius: 10px;
      padding: 12px 16px;
      margin-top: 10px;
    }

    /* ── TABLE STYLES ── */
    .table-section { overflow-x: auto; }
    .plan-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .plan-table th, .plan-table td { padding: 9px 12px; border-bottom: 1px solid #F0F0F0; }
    .plan-table thead th { font-size: 11px; font-weight: 700; }
    .plan-table tbody tr:nth-child(even) { background: #FAFAFA; }
    .plan-table tbody tr:nth-child(odd) { background: white; }

      background: #E0D5F7; color: #4527A0;
      border-radius: 8px; padding: 5px 12px;
      font-weight: 800; font-size: 12px;
      white-space: nowrap; display: inline-block;
    }
    .hidden { display: none !important; }
  </style>

function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function renderActivityLine(act, phaseColor) {
  if (act.startsWith("🗓")) {
    const colonIdx = act.indexOf(":");
    const dayLabel = act.slice(0, colonIdx);
    const dayTask  = act.slice(colonIdx + 1).trim();
    return `<div style="margin-bottom:6px">
      <span class="day-label" style="background:${phaseColor}">${dayLabel}</span>
      <span style="font-size:12px;color:#333">${dayTask}</span>
    </div>`;
  }
  return `<div style="font-size:12px;color:#555;line-height:1.6;margin-bottom:3px">• ${act}</div>`;
}

// ══════════════════════════════════════

function renderMkt(phases, activePhaseIdx, pasanteId) {
  const phase = phases[activePhaseIdx];

  const phaseBtnsHtml = phases.map((p, i) => `
    <button class="phase-btn ${i===activePhaseIdx?"active":""}"
            style="${i===activePhaseIdx ? `background:${p.color};color:white;border-color:${p.color}` : ""}"
            onclick="setMktPhase('${pasanteId}', ${i})">
      <span class="phase-id">${p.id}</span>
      ${p.name.length > 22 ? p.name.slice(0,22)+"…" : p.name}
    </button>`).join("");

  const weeksHtml = phase.weeks.map((w, wi) => {
    const actsHtml = w.acts.map(a => renderActivityLine(a, phase.color)).join("");
    const entsHtml = w.ents.map(e =>
      `<div class="ent-pill" style="background:${phase.light};color:${phase.color}">${e}</div>`
    ).join("");

    return `
    <div class="week-row" style="background:${wi%2===0?"white":"#FAFAFA"}">
      <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
        <span class="sem-badge" style="background:${phase.light};color:${phase.color}">${w.sem}</span>
        <span style="color:#777;font-size:12px">📅 ${w.days}</span>
        <span class="ms-auto hrs-badge" style="background:${phase.light};color:${phase.color}">⏱ ${w.hrs}</span>
      </div>
      <div class="row g-2">
        <div class="col-md-7">
          <div style="font-size:11px;font-weight:700;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Actividades</div>
          ${actsHtml}
        </div>
        <div class="col-md-5">
          <div style="font-size:11px;font-weight:700;color:#888;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px">Entregables</div>
          ${entsHtml}
        </div>
      </div>
    </div>`;
  }).join("");

  return `
    <div class="d-flex flex-wrap mb-3">${phaseBtnsHtml}</div>
    <div style="background:white;border-radius:12px;overflow:hidden;box-shadow:0 1px 8px rgba(0,0,0,.07)">
      <div style="background:${phase.color};padding:14px 20px;display:flex;justify-content:space-between;align-items:center">
        <div>
          <div style="color:rgba(255,255,255,.7);font-size:10px;font-weight:700;letter-spacing:1px">${phase.id}</div>
          <div style="color:white;font-weight:800;font-size:16px;margin-top:2px">${phase.name}</div>
          <div style="color:rgba(255,255,255,.8);font-size:12px;margin-top:2px">📅 ${phase.dates}</div>
        </div>
        <div style="color:rgba(255,255,255,.8);font-size:12px">${phase.weeks.length} semana${phase.weeks.length>1?"s":""}</div>
      </div>
      ${weeksHtml}
    </div>`;
}

function renderPlanDetail() {
  const detailEl = document.getElementById("planDetail");
  if (!selectedPasante) {
    detailEl.classList.add("hidden");
    return;
  }

  const p = pasantes.find(x => x.id === selectedPasante);
  let innerHtml = "";

  if (p.id === "dariel")     innerHtml = renderDariel();
  if (p.id === "alejandra")  innerHtml = renderMkt(alePhases, mktPhaseAle, "alejandra");
  if (p.id === "paola")      innerHtml = renderMkt(paolaPhases, mktPhasePao, "paola");

  detailEl.innerHTML = `
    <div style="background:white;border-radius:14px;box-shadow:0 2px 16px rgba(0,0,0,.1);overflow:hidden">
      <div class="plan-detail-header" style="background:linear-gradient(135deg,${p.color} 0%,${p.color}CC 100%)">
        <span class="avatar-lg">${p.avatar}</span>
        <div>
          <div style="color:rgba(255,255,255,.7);font-size:11px;font-weight:700;letter-spacing:1px">PLAN DE TRABAJO</div>
          <div style="color:white;font-weight:800;font-size:20px">${p.name}</div>
          <div style="color:rgba(255,255,255,.8);font-size:13px;margin-top:2px">${p.area} · ${p.horas}</div>
        </div>
      </div>
      <div style="padding:20px 24px">${innerHtml}</div>
    </div>`;

  detailEl.classList.remove("hidden");
}

// ══════════════════════════════════════
//  EVENT HANDLERS
// ══════════════════════════════════════
function selectPasante(id) {
  selectedPasante = selectedPasante === id ? null : id;
  renderCards();
  renderPlanDetail();
  if (selectedPasante) {
    setTimeout(() => {
      document.getElementById("planDetail").scrollIntoView({ behavior:"smooth", block:"start" });
    }, 50);
  }
}

function setDarielTab(tab) {
  darielTab = tab;
  renderPlanDetail();
}

function setMktPhase(pasanteId, idx) {
  if (pasanteId === "alejandra") mktPhaseAle = idx;
  if (pasanteId === "paola")     mktPhasePao = idx;
  renderPlanDetail();
}
